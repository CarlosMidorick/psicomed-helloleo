name: Create Master Branch

on:
  push:
    branches:
      - copilot/make-master-default-branch
  workflow_dispatch:

jobs:
  create-master:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Create and push master branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if master branch exists on remote
          if git ls-remote --heads origin master | grep -q master; then
            echo "Master branch already exists on remote"
          else
            echo "Creating master branch"
            git checkout -b master
            git push origin master
            echo "Master branch created and pushed"
          fi
